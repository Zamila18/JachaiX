server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    # Docker's embedded DNS — lets nginx RE-RESOLVE the `app` container IP at
    # request time. Without this, nginx caches app's IP at startup and returns
    # 502 after the app container restarts/recreates (and gets a new IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Variable in fastcgi_pass forces per-request DNS resolution via the resolver above.
        set $jx_app app:9000;
        fastcgi_pass $jx_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    300s;
    }

    location ~ /\.ht {
        deny all;
    }
}