version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - jachaix

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - jachaix

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: R00t@Jcx#2026!
      MYSQL_DATABASE: jachaix
      MYSQL_USER: jachaix
      MYSQL_PASSWORD: Jcx@S3cur3#Db!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jachaix

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jachaix

volumes:
  mysql_data:
  qdrant_data:

networks:
  jachaix:
    driver: bridge