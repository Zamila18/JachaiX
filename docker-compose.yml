version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - jachaix

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
      - qdrant
    networks:
      - jachaix

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jachaix

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jachaix

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jachaix

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    networks:
      - jachaix
    restart: unless-stopped

  embedder-service:
    build:
      context: ./services/embedder-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: jachaix_knowledge
    networks:
      - jachaix
    restart: unless-stopped

  reranker-service:
    build:
      context: ./services/reranker-service
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    networks:
      - jachaix
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  redis_data:

networks:
  jachaix:
    driver: bridge