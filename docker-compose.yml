services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - jachaix

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
      - qdrant
    networks:
      - jachaix

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jachaix

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jachaix

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jachaix

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - easyocr_models:/root/.EasyOCR
    networks:
      - jachaix
    restart: unless-stopped

  embedder-service:
    build:
      context: ./services/embedder-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: knowledge_base
    networks:
      - jachaix
    restart: unless-stopped

  reranker-service:
    build:
      context: ./services/reranker-service
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    networks:
      - jachaix
    restart: unless-stopped

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      JACHAIX_API_URL: http://nginx/api/v1
      EMBEDDER_URL: http://embedder-service:5002
      MCP_HOST: 0.0.0.0
      MCP_PORT: 5004
    depends_on:
      - nginx
      - embedder-service
    networks:
      - jachaix
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  redis_data:
  easyocr_models:

networks:
  jachaix:
    driver: bridge