services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - jachaix

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
      - ./scripts:/var/www/scripts:ro
      - ./corpus:/var/www/corpus
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
      - qdrant
    networks:
      - jachaix

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jachaix

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jachaix

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - jachaix

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - easyocr_models:/root/.EasyOCR
    networks:
      - jachaix
    restart: unless-stopped

  embedder-service:
    build:
      context: ./services/embedder-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: knowledge_base
      JINA_API_KEY: jina_8caf5564e77c45f5b8f93cbe8945ba9dJCUh8VSUmXqsTM0cYIeH87-NptzO
      JINA_MODEL: jina-embeddings-v3
      JINA_DIMS: "1024"
    networks:
      - jachaix
    restart: unless-stopped

  reranker-service:
    build:
      context: ./services/reranker-service
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf_models:/root/.cache/huggingface
    networks:
      - jachaix
    restart: unless-stopped

  reranker-en-service:
    build:
      context: ./services/reranker-en-service
      dockerfile: Dockerfile
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf_models:/root/.cache/huggingface
    networks:
      - jachaix
    restart: unless-stopped

  image-forensics-service:
    build:
      context: ./services/image-forensics-service
      dockerfile: Dockerfile
    ports:
      - "5007:5007"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf_models:/root/.cache/huggingface
    networks:
      - jachaix
    restart: unless-stopped

  kb-worker:
    image: python:3.11-slim
    volumes:
      - ./scripts:/scripts
      - ./corpus:/corpus
    environment:
      RAW_DIR: /corpus/raw
      EMBEDDER_URL: http://embedder-service:5002/embed/text
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: knowledge_base
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
    networks:
      - jachaix
    restart: unless-stopped
    depends_on:
      - embedder-service
      - qdrant
    command: >
      bash -c "
        pip install requests qdrant-client trafilatura feedparser beautifulsoup4 lxml -q &&
        python /scripts/crawl_refresh.py --max-per-source 15 --lookback-days 7 &&
        python /scripts/crawl_bangla.py  --max-per-source 15 --lookback-days 7 &&
        python /corpus/chunker/run_chunker.py &&
        while true; do
          sleep 86400;
          python /scripts/crawl_refresh.py --max-per-source 15 --lookback-days 2;
          python /scripts/crawl_bangla.py  --max-per-source 15 --lookback-days 2;
          python /corpus/chunker/run_chunker.py;
        done
      "

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      JACHAIX_API_URL: http://nginx/api/v1
      EMBEDDER_URL: http://embedder-service:5002
      MCP_HOST: 0.0.0.0
      MCP_PORT: 5004
    depends_on:
      - nginx
      - embedder-service
    networks:
      - jachaix
    restart: unless-stopped

  mcp-ops-server:
    build:
      context: ./services/mcp-ops-server
      dockerfile: Dockerfile
    ports:
      - "5008:5008"
    environment:
      JACHAIX_API_URL: http://nginx/api/v1
      MCP_HOST: 0.0.0.0
      MCP_PORT: 5005
      MCP_TRANSPORT: streamable-http
    depends_on:
      - nginx
    networks:
      - jachaix
    restart: unless-stopped

  mcp-docs-server:
    build:
      context: ./services/mcp-docs-server
      dockerfile: Dockerfile
    ports:
      - "5006:5006"
    environment:
      JACHAIX_API_URL: http://nginx/api/v1
      MCP_HOST: 0.0.0.0
      MCP_PORT: 5006
      MCP_TRANSPORT: streamable-http
    depends_on:
      - nginx
    networks:
      - jachaix
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  redis_data:
  easyocr_models:
  hf_models:

networks:
  jachaix:
    driver: bridge