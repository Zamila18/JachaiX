name: Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare env files
        run: |
          test -f .env || cp .env.example .env
          test -f backend/.env || cp backend/.env.example backend/.env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..120}; do
            if curl -sf http://127.0.0.1:8080/api/v1/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs app
          exit 1

      - name: Run regression suite with gate
        shell: pwsh
        run: |
          ./scripts/run_regression_suite.ps1 `
            -PythonExe python `
            -BaseUrl "http://127.0.0.1:8080/api/v1" `
            -FalsePrecisionFloor 0.75 `
            -MultilingualFalsePrecisionFloor 0.70 `
            -MacroF1Floor 0.45

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            scripts/eval_human_latest.json
            scripts/eval_multilingual_slice_results.json

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
